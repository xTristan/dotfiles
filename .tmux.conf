# Requires tmux >= 2.9 (style options)

# prefix: C-q
unbind C-b
set -g prefix C-q

# splits
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# reload
bind r source-file ~/.tmux.conf \; display "reloaded"

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

setw -g mode-keys emacs
set -g mouse on
set -g escape-time 10
set -g history-limit 50000

# rotate window with prefix C-q C-q, cycle panes with prefix q
bind C-q rotate-window
bind q select-pane -t :.+

# alerts
set -g bell-action any
setw -g monitor-activity on
set -g visual-activity on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g allow-rename off

# status bar
set -g status on
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 100
set -g status-style 'fg=#FF6E40,bg=#212121'
set -g status-left '[#S::#W] <#(whoami) -#(uptime | cut -d " " -f 1,2,3)>'
set -g status-right '<%r %a %Y> [#H]'
setw -g window-status-format '[#W]'
setw -g window-status-current-format '[#F #W]'
setw -g window-status-current-style 'fg=#81DAFA'

# panes: shade inactive, darken active; border labels at bottom
setw -g window-style 'bg=#262626'
setw -g window-active-style 'bg=#121212'
setw -g pane-border-status bottom
set -g pane-border-style 'fg=colour237'
set -g pane-active-border-style 'fg=colour237,bg=#3a3a3a'
